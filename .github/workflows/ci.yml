name: CI

# Typecheck + testes. Até então o repo só tinha o build da imagem (release-ghcr.yml),
# que compila mas não roda `bun test` — os gates de arquitetura e de contrato só
# valiam para quem lembrasse de rodá-los na própria máquina.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      # Sem `.env` no runner, então valem os defaults de tests/setup/env.ts — que trazem
      # as duas faces do Kratos com valores distintos, como em produção. É justamente a
      # condição em que o gate de endpoints tem o que provar (infra#14).
      - name: Tests
        run: bun test
